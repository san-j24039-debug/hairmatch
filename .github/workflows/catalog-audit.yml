name: Review product information changes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-products.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: product-update-review
          path: test-results/product-update-report.json
